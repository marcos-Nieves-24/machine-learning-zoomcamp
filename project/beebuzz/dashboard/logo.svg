<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BeeBuzz logo</title>
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#0f1117"/>
  <!-- Hexagon (honeycomb / bee) - flat top, larger -->
  <polygon points="64,40 192,40 224,128 192,216 64,216 32,128" fill="#f5a623"/>
  <!-- Inner hexagon (negative space) -->
  <polygon points="84,68 172,68 196,128 172,188 84,188 60,128" fill="#0f1117"/>
  <!-- Sound waves (3 arcs, larger) -->
  <path d="M96,104 Q128,84 160,104" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <path d="M84,124 Q128,100 172,124" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <path d="M72,144 Q128,116 184,144" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  <!-- Bee body (small dot) -->
  <circle cx="128" cy="120" r="8" fill="#f5a623"/>
</svg>